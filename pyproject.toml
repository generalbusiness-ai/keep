[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keep-skill"
version = "0.154.0"
description = "Reflective memory - remember and search documents by meaning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Hugh Pyle"}]
keywords = ["semantic-memory", "vector-search", "embeddings", "chromadb", "agents", "langchain", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "chromadb>=1.5,<2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "tomli-w>=1.0",
    # Lightweight API SDKs (~2MB total, no heavy deps)
    "openai>=1.0",
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    # Mistral providers (embeddings, chat, OCR) use the REST API directly via httpx
    # — no mistralai SDK dependency.
    # Document extraction
    "pyjwt>=2.12.0",
    "pypdf>=6.10.0",  # GHSA-3crg-w4f6-42mx and CVE-2026-33699 fixes
    "pypdfium2>=4.0",
    "beautifulsoup4>=4.9",
    "lxml>=6.1.0",  # CVE-2026-41066 fix for XML entity resolution defaults
    "python-docx>=1.0",
    "python-pptx>=1.0",
    # Audio metadata
    "tinytag>=2.2.1",
    # Image metadata
    "Pillow>=10.0",
    # Remote API client
    "httpx>=0.27,<1.0",
    # Security floor for transitive users of requests/google-auth stacks.
    "urllib3>=2.7.0",
    # MCP stdio server
    "mcp>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    # Security floor for transitive consumers via uvicorn[standard] / pydantic-settings.
    "python-dotenv>=1.2.2",
    # CEL predicates for state-doc rules
    "common-expression-language>=0.5",
    # Interactive CLI prompts (setup wizard)
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://keep.generalbusiness.ai"
Documentation = "https://docs.generalbusiness.ai/guides/"
Repository = "https://github.com/generalbusiness-ai/keep"

[project.optional-dependencies]
# Local models (macOS Apple Silicon optimized, ~500MB with PyTorch)
local = [
    "mlx>=0.10; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.10; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "sentence-transformers>=2.2",
]
# Media description (Apple Silicon vision + audio models)
media = [
    "mlx-vlm>=0.1; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.1; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
# LangChain integration (LangGraph BaseStore, Retriever, Tools, Middleware)
langchain = [
    "langchain-core>=1.0.0,<2.0.0",
    "langgraph-checkpoint>=2.1.0,<5.0.0",
]
# Development
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[project.scripts]
keep = "keep.cli_app:main"
keepd = "keep.daemon:main"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["keep"]
# Node dev dependencies are build-time only. The wheel needs only the
# bundled dist/index.js (force-included below); node_modules would add
# ~12 MB of binaries we never ship.
exclude = [
    "keep/data/openclaw-plugin/node_modules",
    "keep/data/openclaw-plugin/node_modules/**",
]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "keep/SKILL.md"
"README.md" = "keep/README.md"
"docs" = "keep/docs"
# Ensure the pre-built OpenClaw plugin entry point ships in the wheel even
# if .gitignore rules change. `bump_version.py` rebuilds this file before
# `uv build` runs; the hatch hook (hatch_build.py) verifies its presence.
"keep/data/openclaw-plugin/dist/index.js" = "keep/data/openclaw-plugin/dist/index.js"

[tool.hatch.build.targets.sdist]
include = [
    "/keep",
    "/docs",
    "/SKILL.md",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "keep/data/openclaw-plugin/node_modules",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["D"]
ignore = [
    "D100",  # Missing docstring in public module
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "D301",  # Typer uses \b as a formatting directive, not a Python escape
    "D411",  # Blank line before "Examples" breaks Click's \b paragraph scoping
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"bench/*.py" = ["D101"]
"bench/**/*.py" = ["D101"]
"tests/*.py" = ["D101"]
"tests/**/*.py" = ["D101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "dist", ".git"]
addopts = "-m 'not slow and not smoke'"
markers = [
    "slow: marks tests as slow (require ML models)",
    "e2e: marks tests as end-to-end (require real providers)",
    "smoke: end-to-end smoke tests against the live keep.generalbusiness.ai service (require KEEPNOTES_API_KEY; opt-in via -m smoke)",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
]

[tool.coverage.run]
source = ["keep"]
omit = [
    "keep/providers/mlx*.py",
    "keep/providers/whisper*.py",
    "keep/setup_wizard.py",
    "keep/data/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "raise NotImplementedError",
]
