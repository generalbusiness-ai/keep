name: Security Audit
on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

jobs:
  license-check:
    name: Check dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Build OpenClaw plugin bundle
        working-directory: keep/data/openclaw-plugin
        run: |
          npm ci
          node build.mjs
      - name: Install dependencies
        run: |
          uv sync --no-dev
          uv pip install pip-licenses
      - name: Check licenses
        run: |
          uv run pip-licenses --fail-on="GNU General Public License v2 (GPLv2);\
          GNU General Public License v3 (GPLv3);\
          GNU General Public License v2 or later (GPLv2+);\
          GNU General Public License v3 or later (GPLv3+);\
          GNU Affero General Public License v3 (AGPLv3);\
          GNU Affero General Public License v3 or later (AGPLv3+);\
          GNU Lesser General Public License v2 (LGPLv2);\
          GNU Lesser General Public License v2 or later (LGPLv2+);\
          GNU Lesser General Public License v3 (LGPLv3);\
          GNU Lesser General Public License v3 or later (LGPLv3+)" \
            --format=plain --order=license
      - name: Flag UNKNOWN licenses
        run: |
          UNKNOWN=$(uv run pip-licenses --format=csv | grep 'UNKNOWN' || true)
          if [ -n "$UNKNOWN" ]; then
            echo "::warning::Packages with UNKNOWN license metadata:"
            echo "$UNKNOWN"
          fi

  pip-audit:
    name: Audit Python dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project > /tmp/requirements.txt
          # CVE-2026-45829: chromadb pre-auth RCE on its HTTP server
          #   (/api/v2/.../collections with trust_remote_code). keep only uses
          #   chromadb.PersistentClient (embedded, on-disk) and never runs the
          #   chromadb server, so the endpoint is unreachable. No upstream fix
          #   exists (all releases 1.0.0-1.5.9 affected).
          pip-audit -r /tmp/requirements.txt --desc \
            --ignore-vuln CVE-2026-45829
