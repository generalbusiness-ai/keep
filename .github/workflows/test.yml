name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Check lock file is current
        run: uv lock --check

      - name: Build OpenClaw plugin bundle
        working-directory: keep/data/openclaw-plugin
        run: |
          npm ci
          node build.mjs

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra langchain

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --tb=short -q -m "not slow and not e2e"
        env:
          # Dummy key so config detects a provider; mock_providers fixture
          # intercepts before any real API call is made
          OPENAI_API_KEY: sk-test-ci-dummy-key

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build OpenClaw plugin bundle
        working-directory: keep/data/openclaw-plugin
        run: |
          npm ci
          node build.mjs

      - name: Install dependencies
        run: uv sync --python 3.12 --extra dev --extra langchain

      - name: Run e2e tests
        run: uv run --python 3.12 pytest --tb=short -q -m e2e
        env:
          # Dummy key sufficient — e2e tests use KEEP_LOCAL_ONLY=1 and
          # read-only commands; no real provider network calls are made
          OPENAI_API_KEY: sk-test-ci-dummy-key
